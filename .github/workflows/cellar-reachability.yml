# D-01's conditional probe.
#
# Decision D-01 retrieves Directive (EU) 2023/970 primary text through the
# Publications Office Cellar REST API. That decision carries an explicit
# conditional: Cellar reachability *from CI* was UNKNOWN, and if it fails the
# retrieval method returns to the user rather than being silently substituted.
#
# This job answers that yes/no question and nothing else. It deliberately has
# NO retry loop: a retry would mask a hard failure, and a masked failure here
# would silently invalidate every decision built on D-01.
name: cellar-reachability

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  cellar-reachable:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Cellar for CELEX 32023L0970 (EN expression)
        run: |
          set -euo pipefail

          curl -sS -L \
            -H 'Accept: application/xhtml+xml' \
            -H 'Accept-Language: eng' \
            -D headers.txt \
            -o body.xhtml \
            -w 'http_code=%{http_code}\nsize_download=%{size_download}\nurl_effective=%{url_effective}\n' \
            'http://publications.europa.eu/resource/celex/32023L0970' > metrics.txt

          STATUS=$(sed -n 's/^http_code=//p' metrics.txt | tr -d '\r')
          FINAL_URL=$(sed -n 's/^url_effective=//p' metrics.txt | tr -d '\r')
          ETAG=$(grep -i '^etag:' headers.txt | tail -1 | sed 's/^[Ee][Tt][Aa][Gg]:[[:space:]]*//' | tr -d '\r')
          LAST_MOD=$(grep -i '^last-modified:' headers.txt | tail -1 | sed 's/^[^:]*:[[:space:]]*//' | tr -d '\r')
          BYTES=$(wc -c < body.xhtml)

          # CI evidence, recorded in the run log so the pinned expression URI and
          # the ETag are citable from the plan summary.
          echo "resolved pinned expression URI: ${FINAL_URL}"
          echo "ETag: ${ETAG}"
          echo "Last-Modified: ${LAST_MOD}"
          echo "body bytes: ${BYTES}"

          # Assertion 1 — exactly 200. Not merely 2xx: the eur-lex.europa.eu web
          # front end answers 202 with a zero-length body and res.ok === true.
          if [ "${STATUS}" != "200" ]; then
            echo "FAIL: expected HTTP status exactly 200, got '${STATUS}'"
            exit 1
          fi

          # Assertion 2 — byte floor. The authentic EN expression is ~193 KB.
          if [ "${BYTES}" -le 100000 ]; then
            echo "FAIL: body is ${BYTES} bytes, at or below the 100000-byte floor"
            exit 1
          fi

          # Assertion 3 — the cited article's own structural id is present.
          if ! grep -q 'id="art_7"' body.xhtml; then
            echo 'FAIL: id="art_7" absent from a 200 response — this is a data defect, not an outage'
            exit 1
          fi

          echo "PASS: Cellar answers 200 from a GitHub Actions runner with the art_7 subtree present."
          echo "D-01's conditional is discharged with CI evidence."
